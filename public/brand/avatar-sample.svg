<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7B6CE7"/>
      <stop offset="1" stop-color="#4A3AB8"/>
    </linearGradient>
    <clipPath id="circle">
      <circle cx="40" cy="40" r="40"/>
    </clipPath>
  </defs>
  <g clip-path="url(#circle)">
    <rect width="80" height="80" fill="url(#bg)"/>
    <!-- shirt / body -->
    <ellipse cx="40" cy="78" rx="34" ry="22" fill="#1F1B4A"/>
    <!-- neck -->
    <rect x="32" y="48" width="16" height="14" rx="5" fill="#E7B58E"/>
    <!-- head -->
    <circle cx="40" cy="34" r="14" fill="#F4C9A0"/>
    <!-- hair -->
    <path d="M26 32c0-9 6-16 14-16s14 7 14 16c0-3-1-5-3-6-2 1-5 2-8 2-4 0-7-1-9-2-2 0-5 1-5 2-1 1-3 2-3 4z" fill="#3A2A1F"/>
    <!-- smile -->
    <path d="M36 39c1 1 2 2 4 2s3-1 4-2" stroke="#7E4C2A" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  </g>
</svg>
